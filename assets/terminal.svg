<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -45 840 445" width="840" height="445">
  <defs>
    <style>
      .t-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <!-- Cyber Neon Blue Gradient -->
    <linearGradient id="cyberBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003884" />
      <stop offset="25%" stop-color="#0969da" />
      <stop offset="55%" stop-color="#1f6feb" />
      <stop offset="80%" stop-color="#58a6ff" />
      <stop offset="95%" stop-color="#a5d6ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Electric Cyan Blue Glow Filter -->
    <filter id="cyberBlueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Frieren Hair Gradient -->
    <linearGradient id="frierenHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f2f5fa" />
      <stop offset="100%" stop-color="#d0d7e5" />
    </linearGradient>

    <!-- Clip path so Frieren never leaks into terminal body below y=5 -->
    <clipPath id="frierenClip">
      <rect x="550" y="-70" width="280" height="75" />
    </clipPath>
  </defs>

  <!-- Window Container -->
  <rect x="0" y="0" width="840" height="400" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- FRIEREN CHIBI (Head, Ears, Hair peeking from behind Titlebar) -->
  <g clip-path="url(#frierenClip)">
    <g transform="translate(685, 0)">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0,48; 0,48; 0,0; 0,-1; 0,0; 0,48; 0,48; 0,0; 0,0; 0,48; 0,48"
          keyTimes="0; 0.25; 0.32; 0.42; 0.50; 0.54; 0.72; 0.78; 0.88; 0.92; 1"
          dur="20s" repeatCount="indefinite" />

        <!-- 1. Back Twintails -->
        <path d="M 10 -4 C -12 6, -22 30, -12 50 C -5 40, 2 20, 14 0 Z" fill="#c5cddb" />
        <path d="M 70 -4 C 92 6, 102 30, 92 50 C 85 40, 78 20, 66 0 Z" fill="#c5cddb" />

        <!-- 2. Pointed Elf Ears -->
        <!-- Left Ear -->
        <path d="M 14 -7 C -8 -12, -22 -16, -32 -20 C -24 -6, -8 0, 14 2 Z" fill="#ffe5db" stroke="#f0bda8" stroke-width="0.8" />
        <path d="M 6 -7 C -6 -11, -16 -14, -22 -17 C -15 -9, -4 -5, 8 -2 Z" fill="#f8b49b" opacity="0.6" />
        <polygon points="-20,-8 -17,1 -23,1" fill="#e63946" />

        <!-- Right Ear -->
        <path d="M 66 -7 C 88 -12, 102 -16, 112 -20 C 104 -6, 88 0, 66 2 Z" fill="#ffe5db" stroke="#f0bda8" stroke-width="0.8" />
        <path d="M 74 -7 C 86 -11, 96 -14, 102 -17 C 95 -9, 84 -5, 72 -2 Z" fill="#f8b49b" opacity="0.6" />
        <polygon points="100,-8 97,1 103,1" fill="#e63946" />

        <!-- 3. Face Base -->
        <ellipse cx="40" cy="-9" rx="28" ry="24" fill="#fff3ec" />

        <!-- Soft Blush -->
        <ellipse cx="22" cy="-2" rx="5.5" ry="2.5" fill="#ffb4a2" opacity="0.65" />
        <ellipse cx="58" cy="-2" rx="5.5" ry="2.5" fill="#ffb4a2" opacity="0.65" />

        <!-- 4. Frieren's Eyes (Emerald Green, signature calm/blank expression) -->
        <!-- Left Eye -->
        <ellipse cx="26" cy="-9" rx="5.2" ry="6.2" fill="#1b4332" />
        <ellipse cx="26" cy="-8" rx="4.4" ry="5.2" fill="#2d6a4f" />
        <ellipse cx="26" cy="-7" rx="3.4" ry="3.8" fill="#52b788" />
        <circle cx="24.5" cy="-11" r="1.8" fill="#ffffff" />
        <circle cx="27.8" cy="-6" r="0.9" fill="#d8f3dc" />
        <path d="M 19 -14 Q 26 -17, 33 -13" fill="none" stroke="#2d3748" stroke-width="1.8" stroke-linecap="round" />

        <!-- Right Eye -->
        <ellipse cx="54" cy="-9" rx="5.2" ry="6.2" fill="#1b4332" />
        <ellipse cx="54" cy="-8" rx="4.4" ry="5.2" fill="#2d6a4f" />
        <ellipse cx="54" cy="-7" rx="3.4" ry="3.8" fill="#52b788" />
        <circle cx="52.5" cy="-11" r="1.8" fill="#ffffff" />
        <circle cx="55.8" cy="-6" r="0.9" fill="#d8f3dc" />
        <path d="M 47 -13 Q 54 -17, 61 -14" fill="none" stroke="#2d3748" stroke-width="1.8" stroke-linecap="round" />

        <!-- Calm Eyebrows -->
        <path d="M 21 -18 Q 26 -20, 31 -18" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" />
        <path d="M 49 -18 Q 54 -20, 59 -18" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round" />

        <!-- Cute Small Mouth -->
        <ellipse cx="40" cy="-4" rx="0.8" ry="0.6" fill="#e07a5f" />
        <path d="M 38 0 Q 40 1.5, 42 0" fill="none" stroke="#d96b52" stroke-width="1.2" stroke-linecap="round" />

        <!-- 5. Frieren's Hair (Bangs &amp; Twintails) -->
        <path d="M 14 -21 Q 26 -8, 38 -13 Q 39 -21, 40 -27 Q 41 -21, 42 -13 Q 54 -8, 66 -21 C 60 -30, 20 -30, 14 -21 Z" fill="url(#frierenHair)" />
        <path d="M 14 -19 Q 12 -4, 17 6 Q 13 -4, 16 -17 Z" fill="#e2e7f0" />
        <path d="M 66 -19 Q 68 -4, 63 6 Q 67 -4, 64 -17 Z" fill="#e2e7f0" />
        <rect x="7" y="-16" width="5" height="4" rx="1.5" fill="#d4af37" />
        <rect x="68" y="-16" width="5" height="4" rx="1.5" fill="#d4af37" />
      </g>
    </g>
