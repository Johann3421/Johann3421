        <rect x="5" y="-14" width="5.5" height="4" rx="1.5" fill="#881337" stroke="#4c0519" stroke-width="0.5" />
        <rect x="69.5" y="-14" width="5.5" height="4" rx="1.5" fill="#881337" stroke="#4c0519" stroke-width="0.5" />

      </g>
