    <rect x="22" y="0" width="16" height="12" rx="2" fill="#ffbd2e" />
    <rect x="44" y="0" width="16" height="12" rx="2" fill="#27c93f" />
    <rect x="66" y="0" width="16" height="12" rx="2" fill="#58a6ff" />
    <rect x="88" y="0" width="16" height="12" rx="2" fill="#d2a8ff" />
    <rect x="110" y="0" width="16" height="12" rx="2" fill="#79c0ff" />
  </g>

  <!-- Right Pane: Command 1 (johann stack) -->
