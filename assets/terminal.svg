    <text x="350" y="66" font-size="12.5">
      <tspan fill="#7ee787" font-weight="bold">&#10095;</tspan> <tspan fill="#f0f6fc">johann</tspan> <tspan fill="#f2cc60">--stack</tspan>
    </text>
    <text x="364" y="86" font-size="11.5" fill="#8b949e">
