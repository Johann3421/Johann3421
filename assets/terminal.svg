<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -52 840 452" width="840" height="452">
  <defs>
    <style>
      .t-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <!-- Cyber Neon Blue Gradient -->
    <linearGradient id="cyberBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003884" />
      <stop offset="25%" stop-color="#0969da" />
      <stop offset="55%" stop-color="#1f6feb" />
      <stop offset="80%" stop-color="#58a6ff" />
      <stop offset="95%" stop-color="#a5d6ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Electric Cyan Blue Glow Filter -->
    <filter id="cyberBlueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Frieren Hair Gradient: Pristine silver with soft lilac-blue undertone -->
    <linearGradient id="frierenHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f2f5fc" />
      <stop offset="75%" stop-color="#e1e6f4" />
      <stop offset="100%" stop-color="#c9d2e5" />
    </linearGradient>

    <!-- Hair highlight sheen -->
    <linearGradient id="hairSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Frieren Eye Gradient: Multi-tonal deep emerald/teal -->
    <radialGradient id="frierenIris" cx="50%" cy="55%" r="52%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <!-- Safety Clip: ensures Frieren never leaks below titlebar into terminal pane -->
    <clipPath id="frierenSafetyClip">
      <rect x="580" y="-60" width="250" height="66" />
    </clipPath>
  </defs>

  <!-- Window Container -->
  <rect x="0" y="0" width="840" height="400" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- ═══════════════ CHIBI FRIEREN (OPTION B: REFINED & ANIMATED) ═══════════════ -->
  <g clip-path="url(#frierenSafetyClip)">
    <g transform="translate(695, 0)">
      <g>
        <!-- Motion Timeline (20s):
             0s - 4.5s: Hidden down (y=52)
             4.5s - 5.8s: Rises smoothly (y=52 -> y=0)
             5.8s - 11.5s: Peeking calmly at Johann's terminal
             11.5s - 12.2s: Ducks down (y=0 -> y=52)
             12.2s - 15.5s: Hidden down
             15.5s - 16.3s: Quick peek up
             16.3s - 18.5s: Brief peek
             18.5s - 19.2s: Ducks down
             19.2s - 20s: Hidden down
        -->
        <animateTransform attributeName="transform" type="translate"
          values="0,52; 0,52; 0,0; 0,-1; 0,0; 0,52; 0,52; 0,0; 0,0; 0,52; 0,52"
          keyTimes="0; 0.22; 0.29; 0.42; 0.57; 0.61; 0.77; 0.81; 0.92; 0.96; 1"
          dur="20s" repeatCount="indefinite" />

        <!-- 1. Back Twintails (Fluid S-curves with layered shadows) -->
        <path d="M 6 -10 C -4 -2, -14 16, -9 36 C -7 44, -1 46, 2 40 C 4 32, 2 14, 8 -6 Z" fill="#b9c4db" />
        <path d="M 7 -9 C -1 -2, -9 12, -5 28 C -3 34, 1 36, 3 32 C 4 25, 3 10, 8 -5 Z" fill="#cfd8eb" />
        <path d="M 7 -8 C 1 0, -5 10, -2 22 C -1 26, 2 28, 4 25 C 5 20, 4 8, 8 -4 Z" fill="url(#frierenHair)" />

        <path d="M 74 -10 C 84 -2, 94 16, 89 36 C 87 44, 81 46, 78 40 C 76 32, 78 14, 72 -6 Z" fill="#b9c4db" />
        <path d="M 73 -9 C 81 -2, 89 12, 85 28 C 83 34, 79 36, 77 32 C 76 25, 77 10, 72 -5 Z" fill="#cfd8eb" />
        <path d="M 73 -8 C 79 0, 85 10, 82 22 C 81 26, 78 28, 76 25 C 75 20, 76 8, 72 -4 Z" fill="url(#frierenHair)" />

        <!-- 2. Pointed Elf Ears (Slender, graceful curves) -->
        <path d="M 16 -12 C 4 -16, -8 -20, -20 -24 C -12 -9, 0 -3, 16 0 Z" fill="#ffebd9" stroke="#f0c2af" stroke-width="0.8" />
        <path d="M 12 -11 C 3 -14, -6 -17, -13 -20 C -7 -10, 0 -5, 12 -2 Z" fill="#fbbda4" opacity="0.45" />
        <circle cx="-10" cy="-9" r="2.2" fill="none" stroke="#d4af37" stroke-width="0.9" />
        <path d="M -10 -7 L -8 -1 L -12 -1 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="0.4" />
        <circle cx="-10" cy="-3" r="0.6" fill="#ffffff" opacity="0.8" />

        <path d="M 64 -12 C 76 -16, 88 -20, 100 -24 C 92 -9, 80 -3, 64 0 Z" fill="#ffebd9" stroke="#f0c2af" stroke-width="0.8" />
        <path d="M 68 -11 C 77 -14, 86 -17, 93 -20 C 87 -10, 80 -5, 68 -2 Z" fill="#fbbda4" opacity="0.45" />
        <circle cx="90" cy="-9" r="2.2" fill="none" stroke="#d4af37" stroke-width="0.9" />
        <path d="M 90 -7 L 92 -1 L 88 -1 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="0.4" />
        <circle cx="90" cy="-3" r="0.6" fill="#ffffff" opacity="0.8" />

        <!-- 3. Chibi Face Base (Round, adorable cheeks) -->
        <ellipse cx="40" cy="-14" rx="27" ry="22" fill="#fff3ec" />
        <ellipse cx="40" cy="-4" rx="20" ry="10" fill="#fff3ec" />

        <!-- Soft Blush -->
        <ellipse cx="20" cy="-8" rx="5" ry="2.2" fill="#fca5a5" opacity="0.4" />
        <ellipse cx="60" cy="-8" rx="5" ry="2.2" fill="#fca5a5" opacity="0.4" />

