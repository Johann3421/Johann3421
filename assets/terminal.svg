    </text>
    <text x="364" y="326" font-size="11.5" fill="#8b949e">
      Location: <tspan fill="#79c0ff">Huanuco, Peru (UTC-5)</tspan>
    </text>
  </g>

  <!-- Tmux Statusbar Bottom -->
  <line x1="0" y1="370" x2="840" y2="370" stroke="#30363d" stroke-width="1" />
  <path d="M0 371 L840 371 L840 390 C840 395.52 835.52 400 830 400 L10 400 C4.48 400 0 395.52 0 390 Z" fill="#161b22" />
  
  <text x="14" y="388" font-size="11" class="t-mono">
    <tspan fill="#7ee787" font-weight="bold">[0]</tspan> <tspan fill="#8b949e">0:zsh* 1:nvim-</tspan>
  </text>
  
  <text x="826" y="388" text-anchor="end" font-size="11" fill="#79c0ff" class="t-mono">
    Johann3421 &#8226; 70 Repositorios &#8226; Huanuco, PE
  </text>

  <!-- Animated Dual Fire Border Beam (MagicUI Kinetic Plasma Perimeter) -->
  <rect x="1" y="1" width="838" height="398" rx="10" ry="10" fill="none"
        stroke="url(#fireGrad)" stroke-width="3.5" stroke-dasharray="160 1070 160 1070" stroke-linecap="round"
        stroke-opacity="0.65" filter="url(#fireGlow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-2460" dur="5s" repeatCount="indefinite" />
  </rect>

  <rect x="1" y="1" width="838" height="398" rx="10" ry="10" fill="none"
        stroke="url(#fireGrad)" stroke-width="1.8" stroke-dasharray="160 1070 160 1070" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-2460" dur="5s" repeatCount="indefinite" />
  </rect>
</svg>
