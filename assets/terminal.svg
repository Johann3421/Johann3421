          <path d="M -4 5 Q 0 6.5, 4.5 5" fill="none" stroke="#64748b" stroke-width="0.8" stroke-linecap="round" />
        </g>

        <!-- Right Eye -->
        <g transform="translate(54, -14)">
          <ellipse cx="0" cy="0" rx="6" ry="6.8" fill="#f8fafc" />
          <ellipse cx="0" cy="0.5" rx="5" ry="5.8" fill="url(#frierenIris)" />
          <ellipse cx="0" cy="0.6" rx="2.2" ry="2.8" fill="#064e3b" />
          <circle cx="-1.8" cy="-2.5" r="2" fill="#ffffff" />
          <ellipse cx="1.6" cy="2.8" rx="1.5" ry="0.9" fill="#a7f3d0" opacity="0.85" />

