<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400">
  <defs>
    <style>
      .t-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="30%" stop-color="#ff5500" />
      <stop offset="70%" stop-color="#ffaa00" />
      <stop offset="100%" stop-color="#ffe680" />
    </linearGradient>
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Window Container -->
  <rect x="0" y="0" width="840" height="400" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- Titlebar -->
  <path d="M0 10 C0 4.48 4.48 0 10 0 L830 0 C835.52 0 840 4.48 840 10 L840 36 L0 36 Z" fill="#161b22" />
  <line x1="0" y1="36" x2="840" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="22" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="40" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="58" cy="18" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="420" y="23" text-anchor="middle" fill="#8b949e" font-size="12" class="t-mono">zsh - tmux session 0: "johann-core"</text>

  <!-- Vertical Divider (Split) -->
  <line x1="330" y1="36" x2="330" y2="370" stroke="#30363d" stroke-width="1" />

  <!-- Left Pane Background -->
  <rect x="1" y="37" width="328" height="333" fill="#0b0f17" />

  <!-- Left Pane: ASCII Art (Slant - Pixel-Perfect Monospace Alignment) -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#58a6ff" font-weight="bold" xml:space="preserve">
    <text x="24" y="58">&#160;&#160;&#160;&#160;&#160;&#160;&#160;__&#160;&#160;&#160;&#160;&#160;&#160;__</text>
    <text x="24" y="68.5">&#160;&#160;&#160;&#160;&#160;&#160;/&#160;/___&#160;&#160;/&#160;/_&#160;&#160;____&#160;_____&#160;&#160;____</text>
    <text x="24" y="79">&#160;__&#160;&#160;/&#160;/&#160;__&#160;\/&#160;__&#160;\/&#160;__&#160;`/&#160;__&#160;\/&#160;__&#160;\</text>
    <text x="24" y="89.5">/&#160;/_/&#160;/&#160;/_/&#160;/&#160;/&#160;/&#160;/&#160;/_/&#160;/&#160;/&#160;/&#160;/&#160;/&#160;/&#160;/</text>
    <text x="24" y="100">\____/\____/_/&#160;/_/\__,_/_/&#160;/_/_/&#160;/_/</text>
  </g>

  <!-- Left Pane: User Host -->
  <text x="24" y="136" font-size="12" class="t-mono">
    <tspan fill="#58a6ff" font-weight="bold">johann</tspan>
    <tspan fill="#8b949e">@</tspan>
    <tspan fill="#58a6ff" font-weight="bold">dev-huanuco</tspan>
  </text>
  <line x1="24" y1="145" x2="310" y2="145" stroke="#30363d" stroke-width="1" />

  <!-- Left Pane: Neofetch Specs -->
  <g class="t-mono" font-size="11.5">
    <text x="24" y="168"><tspan fill="#7ee787" font-weight="bold">OS:</tspan> <tspan fill="#c9d1d9">Linux / Debian / Windows Dev</tspan></text>
    <text x="24" y="188"><tspan fill="#7ee787" font-weight="bold">Host:</tspan> <tspan fill="#c9d1d9">Huanuco, Peru (UTC-5)</tspan></text>
    <text x="24" y="208"><tspan fill="#7ee787" font-weight="bold">Uptime:</tspan> <tspan fill="#c9d1d9">3+ years in engineering</tspan></text>
    <text x="24" y="228"><tspan fill="#7ee787" font-weight="bold">Shell:</tspan> <tspan fill="#c9d1d9">zsh 5.9 + starship</tspan></text>
    <text x="24" y="248"><tspan fill="#7ee787" font-weight="bold">Packages:</tspan> <tspan fill="#c9d1d9">70 active repos (GitHub)</tspan></text>
    <text x="24" y="268"><tspan fill="#7ee787" font-weight="bold">Core:</tspan> <tspan fill="#c9d1d9">POS, RPA, Mobile Kotlin</tspan></text>
    <text x="24" y="288"><tspan fill="#7ee787" font-weight="bold">Editor:</tspan> <tspan fill="#c9d1d9">Neovim / VS Code</tspan></text>
  </g>

